name: ECOS Candidate Comparison
on:
  workflow_dispatch:
    inputs:
      start_month:
        description: Optional YYYY-MM (default latest common 12 months; maximum 24)
        type: string
        default: ''
      end_month:
        description: Optional YYYY-MM (default latest common metadata month; values checked separately)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ecos-candidate-comparison
  cancel-in-progress: false
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and compare candidate series (read only)
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          ECOS_COMPARE_START: ${{ inputs.start_month }}
          ECOS_COMPARE_END: ${{ inputs.end_month }}
        run: python -m src.macro.ecos_compare
