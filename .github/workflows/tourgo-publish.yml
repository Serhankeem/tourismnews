name: TOURGO initial publication (manual)
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Initial bootstrap or explicitly reviewed correction (existing approvals reused)
        type: choice
        options: [initial, update]
        default: initial
      confirm_reviewed_initial_publication:
        description: Request protected bootstrap or reviewed correction AFTER separate activation approval and fresh staging review
        type: boolean
        required: true
        default: false
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  publish-reviewed-initial-release:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_reviewed_initial_publication == true
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/pipeline.yml
    with:
      engine: macro
      tourgo_release: true
      tourgo_profile: ${{ inputs.profile }}
    secrets: inherit
