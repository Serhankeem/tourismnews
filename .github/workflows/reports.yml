name: Research Library weekly collector
on:
  schedule:
    - cron: '40 22 * * 0' # Monday 07:40 Asia/Seoul; scheduler may delay.
  workflow_dispatch:
    inputs:
      force:
        description: Recheck sources before their normal due date (permissions unchanged)
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/reports/**'
      - 'reports_sources.json'
      - 'operating_policy.json'
      - 'site/research.*'
      - '.github/workflows/reports.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
  collect-and-publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/pipeline.yml
    with:
      engine: reports
      force: ${{ inputs.force || false }}
    secrets: inherit
