name: Tourism Pulse RSS collector
on:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '30 1 * * *' # 10:30 Asia/Seoul; GitHub may delay scheduled runs.
  workflow_dispatch:
    inputs:
      backfill_days:
        description: Provider-supplied metadata lookback (no article crawling)
        type: choice
        default: '90'
        options: ['30', '60', '90']
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'sources.json'
      - 'operating_policy.json'
      - 'relevance_reviews.json'
      - 'site/index.html'
      - 'site/currentourism.*'
      - 'site/assets/**'
      - '.github/workflows/collect.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
  collect-and-publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/pipeline.yml
    with:
      engine: news
      backfill_days: ${{ fromJSON(inputs.backfill_days || '90') }}
    secrets: inherit
