name: Macro Monitor official statistics
on:
  schedule:
    - cron: '20 3 * * *' # Daily 12:20 Asia/Seoul; GitHub may delay scheduled runs.
  workflow_dispatch:
    inputs:
      force:
        description: Recheck official public files before the daily interval (permissions unchanged)
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/macro/**'
      - 'macro_sources.json'
      - 'site/macro.*'
      - '.github/workflows/macro.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
  collect-and-publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/pipeline.yml
    with:
      engine: macro
      force: ${{ inputs.force || false }}
    secrets: inherit
